name = "megadeal"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Without this, @opennextjs/cloudflare's /_next/image handler passes every
# image straight through unresized and uncompressed (confirmed in its own
# source — it only transforms when env.IMAGES is bound). Deal/merchant
# photos are uploaded at whatever resolution someone's phone shoots, so this
# was shipping full-size originals to every visitor instead of the sized,
# compressed derivatives next/image's `sizes` prop already asks for.
[images]
binding = "IMAGES"

# Shared, IP/key-keyed store for every rate limit in the app (lib/rateLimit.ts,
# lib/adminRateLimit.ts) — the admin login lockout, and abuse limits on public
# endpoints like /api/email-signup and /api/contact. Create it once with
# `wrangler kv namespace create RATE_LIMIT_KV` (or via Cloudflare dashboard ->
# Workers & Pages -> KV), then paste the id it prints below. Until a real id
# is set, every rate limit falls back to allowing every request (fails open)
# rather than breaking the feature it protects.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
