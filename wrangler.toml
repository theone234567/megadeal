name = "megadeal"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Without this, @opennextjs/cloudflare's /_next/image handler passes every
# image straight through unresized and uncompressed (confirmed in its own
# source — it only transforms when env.IMAGES is bound). Deal/merchant
# photos are uploaded at whatever resolution someone's phone shoots, so this
# was shipping full-size originals to every visitor instead of the sized,
# compressed derivatives next/image's `sizes` prop already asks for.
[images]
binding = "IMAGES"

# Rate limiting (lib/rateLimit.ts, lib/adminRateLimit.ts — the admin login
# lockout, and abuse limits on /api/email-signup and /api/contact) is fully
# built and already deployed in the app code, but is currently INACTIVE:
# it needs a real KV namespace bound here as RATE_LIMIT_KV to actually
# store counters, and there wasn't a real namespace id yet to put here. A
# placeholder id in this file would fail Cloudflare's binding validation
# and block every deploy outright, so the binding is deliberately left out
# for now — every rate-limit check fails open (allows the request) without
# it, exactly as it does today.
#
# To turn rate limiting on: run `wrangler kv namespace create RATE_LIMIT_KV`
# (or create it via Cloudflare dashboard -> Workers & Pages -> KV), then add
# back:
#   [[kv_namespaces]]
#   binding = "RATE_LIMIT_KV"
#   id = "<the id that command printed>"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
