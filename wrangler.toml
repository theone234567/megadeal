name = "megadeal"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Smart Placement: Cloudflare runs the site's server code near the services
# it calls most, rather than near each visitor. A deal page makes several
# Wix reads in a row (lib/fetchDealServer.ts), and from an Auckland data
# centre each one crossed the Pacific; placed near Wix they're short hops,
# and the finished page makes the one long trip back. Cloudflare only moves
# the Worker when its own measurements say it's faster; static files are
# still served from the data centre nearest the visitor either way.
# Remove this block (or set mode = "off") to go back.
[placement]
mode = "smart"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Without this, @opennextjs/cloudflare's /_next/image handler passes every
# image straight through unresized and uncompressed (confirmed in its own
# source — it only transforms when env.IMAGES is bound). Deal/merchant
# photos are uploaded at whatever resolution someone's phone shoots, so this
# was shipping full-size originals to every visitor instead of the sized,
# compressed derivatives next/image's `sizes` prop already asks for.
[images]
binding = "IMAGES"

# Rate limiting (lib/rateLimit.ts, lib/adminRateLimit.ts — the admin login
# lockout, and abuse limits on /api/email-signup, /api/contact and the
# Google Places endpoints) stores its counters here.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "49bc14b529ac4f108051947967a39943"

# MegaDeal's own photo storage (lib/photoStorage.ts): private, served by
# the site at /media/. Only used once PHOTO_STORAGE = "r2" (with the new
# database); until then photos stay on Wix.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "megadeal-photos"

# The nightly database backup (app/api/cron/backup): private, and a
# lifecycle rule on the bucket deletes each backup after 30 days. It skips
# itself while the data is still in Wix.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "megadeal-backups"

# The moving-off-Wix switches (docs/WIX-MIGRATION.md, "Where settings go"):
# kept here, in a commit, so each one is on record and turning it off is a
# revert. Keys and passwords never go here: they're Secrets in the dashboard.
[vars]
# Email through Resend from megadeal.co.nz (RESEND_API_KEY), not Wix.
# Remove the line and deploy to go back to Wix at once.
EMAIL_PROVIDER = "resend"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# NEXT_PUBLIC_GA_MEASUREMENT_ID (components/GoogleAnalytics.tsx) and
# NEXT_PUBLIC_META_PIXEL_ID (components/MetaPixel.tsx) aren't set here —
# Next.js inlines NEXT_PUBLIC_* values at build time, so they have to live
# wherever the build actually runs. For this project that's Cloudflare
# Workers Builds (Cloudflare's own GitHub connection builds and deploys
# every push; its "Workers Builds: megadeal" check shows on each commit),
# so they belong under the Worker's Settings -> Build -> Variables. The
# Build step env in .github/workflows/deploy.yml only applies if that
# workflow's own Deploy step runs, which needs its Cloudflare secrets.
# Settings that must ship with the code go in the code itself (e.g.
# COMING_SOON_LIVE in lib/siteConfig.ts). [vars] in this file isn't right
# either — it's only read at request time, too late for a value that has
# to already be in the bundle.
#
# META_CAPI_ACCESS_TOKEN (lib/metaCapi.ts) is the opposite case: a
# server-only secret for Meta's Conversions API that must never reach the
# browser, so it does NOT get a NEXT_PUBLIC_ prefix and does NOT belong
# here either — set it under this Worker's Settings -> Variables and
# Secrets (runtime, encrypted) instead. It reuses NEXT_PUBLIC_META_PIXEL_ID
# above for which pixel to report events against.
