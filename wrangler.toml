name = "megadeal"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Without this, @opennextjs/cloudflare's /_next/image handler passes every
# image straight through unresized and uncompressed (confirmed in its own
# source — it only transforms when env.IMAGES is bound). Deal/merchant
# photos are uploaded at whatever resolution someone's phone shoots, so this
# was shipping full-size originals to every visitor instead of the sized,
# compressed derivatives next/image's `sizes` prop already asks for.
[images]
binding = "IMAGES"

# Persistent, IP-keyed store for the admin login lockout (lib/adminRateLimit.ts).
# Create it once with `wrangler kv namespace create ADMIN_RATE_LIMIT_KV`
# (or via Cloudflare dashboard -> Workers & Pages -> KV), then paste the id
# it prints below. Until a real id is set, admin login falls back to
# allowing every attempt (fails open) rather than breaking login entirely.
[[kv_namespaces]]
binding = "ADMIN_RATE_LIMIT_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
