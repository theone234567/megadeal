name = "megadeal"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Without this, @opennextjs/cloudflare's /_next/image handler passes every
# image straight through unresized and uncompressed (confirmed in its own
# source — it only transforms when env.IMAGES is bound). Deal/merchant
# photos are uploaded at whatever resolution someone's phone shoots, so this
# was shipping full-size originals to every visitor instead of the sized,
# compressed derivatives next/image's `sizes` prop already asks for.
[images]
binding = "IMAGES"

# Rate limiting (lib/rateLimit.ts, lib/adminRateLimit.ts — the admin login
# lockout, and abuse limits on /api/email-signup, /api/contact and the
# Google Places endpoints) stores its counters here.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "49bc14b529ac4f108051947967a39943"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# NEXT_PUBLIC_GA_MEASUREMENT_ID (components/GoogleAnalytics.tsx) and
# NEXT_PUBLIC_META_PIXEL_ID (components/MetaPixel.tsx) aren't set here —
# Next.js inlines NEXT_PUBLIC_* values at build time, so they live in the
# Cloudflare dashboard under this Worker's Settings -> Builds ->
# Environment variables, not [vars] in this file (which is only read at
# request time, too late for a value that has to already be in the bundle).
