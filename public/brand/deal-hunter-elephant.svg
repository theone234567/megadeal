<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">MegaDeal deal-hunter elephant</title>
  <desc id="desc">A cheerful purple baby elephant holding a magnifying glass and a pink big deals tag.</desc>
  <defs>
    <linearGradient id="body" x1="80" y1="36" x2="270" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a35cff"/>
