<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">MegaDeal elephant</title>
  <desc id="desc">A friendly purple baby elephant face with wide ears, open eyes and a long trunk.</desc>
  <defs>
    <linearGradient id="head" x1="55" y1="35" x2="155" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A45CFF"/>
      <stop offset="1" stop-color="#7A17F0"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D0AEFF"/>
      <stop offset="1" stop-color="#B37EF7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3E137D" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- wide ears -->
    <ellipse cx="48" cy="88" rx="40" ry="47" fill="url(#ear)"/>
    <ellipse cx="172" cy="88" rx="40" ry="47" fill="url(#ear)"/>
    <ellipse cx="49" cy="89" rx="27" ry="33" fill="#F4A6DC" opacity=".92"/>
    <ellipse cx="171" cy="89" rx="27" ry="33" fill="#F4A6DC" opacity=".92"/>

    <!-- round baby face -->
    <ellipse cx="110" cy="83" rx="59" ry="55" fill="url(#head)"/>

    <!-- open eyes -->
    <circle cx="88" cy="76" r="9" fill="#24103C"/>
    <circle cx="132" cy="76" r="9" fill="#24103C"/>
    <circle cx="91" cy="72.5" r="3.2" fill="#fff"/>
    <circle cx="135" cy="72.5" r="3.2" fill="#fff"/>

    <!-- eyebrows for friendly expression -->
    <path d="M76 61c7-6 15-7 23-2M121 59c8-5 16-4 23 2" fill="none" stroke="#57149E" stroke-width="4" stroke-linecap="round"/>

    <!-- blush -->
    <ellipse cx="74" cy="99" rx="10" ry="6" fill="#FF8FCC" opacity=".5"/>
    <ellipse cx="146" cy="99" rx="10" ry="6" fill="#FF8FCC" opacity=".5"/>

    <!-- tiny tusks -->
    <path d="M92 110c-4 8-4 14 2 18 4-7 6-12 5-18Z" fill="#FFF9EC"/>
    <path d="M128 110c4 8 4 14-2 18-4-7-6-12-5-18Z" fill="#FFF9EC"/>

    <!-- long soft trunk -->
    <path d="M110 101c-3 19-2 37 1 53 2 10 12 12 18 5 4-5 2-12-4-14" fill="none" stroke="url(#head)" stroke-width="22" stroke-linecap="round"/>
    <path d="M111 104c-2 17-1 34 2 47" fill="none" stroke="#A05AF8" stroke-width="8" stroke-linecap="round" opacity=".72"/>

    <!-- smile -->
    <path d="M93 99c5 5 11 7 17 7s12-2 17-7" fill="none" stroke="#541396" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
