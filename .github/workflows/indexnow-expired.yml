# Once an hour, asks the site to tell Bing and the other IndexNow search
# engines about deals whose run has just ended (app/api/cron/expired-deals),
# so expired offers leave their results quickly.
#
# Setup, once: create a long random value and add it as CRON_SECRET in
#   - GitHub: Settings -> Secrets and variables -> Actions -> New repository secret
#   - Cloudflare: Workers -> megadeal -> Settings -> Variables and Secrets (type Secret)
# Until both exist this job does nothing.

name: Tell search engines about expired deals

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify for deals that just ended
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet - nothing to do."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://megadeal.co.nz/api/cron/expired-deals
