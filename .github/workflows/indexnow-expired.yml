# By hand only (Actions > Tell search engines about expired deals > Run
# workflow): the hourly run is now Cloudflare's (wrangler.toml [triggers],
# lib/scheduledJobs.ts), since GitHub turns schedules off in a public
# repository after 60 days without a commit. Asks the site to tell Bing
# and the other IndexNow search engines about deals whose run has just
# ended (app/api/cron/expired-deals). Needs CRON_SECRET in GitHub too, the
# same value as in Cloudflare.

name: Tell search engines about expired deals

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify for deals that just ended
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet - nothing to do."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://megadeal.co.nz/api/cron/expired-deals
