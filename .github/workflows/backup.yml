# By hand only (Actions > Nightly database backup > Run workflow): the
# nightly copy itself is now run by Cloudflare (wrangler.toml [triggers],
# lib/scheduledJobs.ts), since GitHub turns schedules off in a public
# repository after 60 days without a commit. This asks the site to save a
# copy of MegaDeal's own database to its private BACKUPS bucket
# (app/api/cron/backup) now. Needs CRON_SECRET in GitHub too, the same
# value as in Cloudflare.

name: Nightly database backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Save a copy of the database
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet - nothing to do."
            exit 0
          fi
          curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://megadeal.co.nz/api/cron/backup
