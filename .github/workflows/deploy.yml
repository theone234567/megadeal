# Deploys the site to Cloudflare Workers on every push to the default
# branch, and on demand from the Actions tab.
#
# Why this exists: the repo had no CI at all, so shipping anything meant
# being at a computer with Cloudflare credentials and remembering to run
# `npm run cf:deploy` by hand. A fix for a production outage — nobody
# could complete a business signup — sat committed and deployable for
# hours because of that gap, and the live site served a stale build in
# the meantime.
#
# Setup, once: add two repository secrets under
# Settings -> Secrets and variables -> Actions
#
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers"
#                          template permissions
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard URL, or
#                          `npx wrangler whoami`
#
# Until both exist the deploy step is skipped, so merging this changes
# nothing on its own.

name: Deploy to Cloudflare

on:
  push:
    branches: [claude/deal-website-storefront-9iqkg3]
  workflow_dispatch:

# Never let two deploys race; cancel an in-flight one if a newer push
# lands, so the last commit is always what ends up live.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail here rather than halfway through a deploy: a type error
      # should never reach the build step.
      - name: Typecheck
        run: npx tsc --noEmit

      # Between typecheck and build for the same reason: these cover the
      # logic a type error can't reach — terms being rewritten behind a
      # merchant's back, a draft losing fields, a deal publishing itself,
      # a query reading one page and calling it the collection. Every case
      # is a bug that actually happened here.
      - name: Unit tests
        run: npm test

      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — built and verified, but not deployed."
          fi

      # Runs either way, so a broken build is caught even before the
      # secrets are added.
      #
      # NEXT_PUBLIC_* values get compiled into the JS bundle right here —
      # this is the only place that matters for them. This project deploys
      # via this workflow, pushing straight to Cloudflare Workers with
      # `opennextjs-cloudflare deploy` below; Cloudflare's own dashboard
      # "Settings -> Builds -> Environment variables" page is for projects
      # where Cloudflare runs the build itself, which isn't what happens
      # here, so anything set there is silently never used. Not a secret —
      # a Pixel ID is already visible in every page's HTML once the site
      # loads — so it's a plain value here rather than a repo secret.
      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: https://megadeal.co.nz
          NEXT_PUBLIC_META_PIXEL_ID: "1478448350759686"

      # Screenshots of / , /coming-soon, /list-your-business, /portal and
      # /megashop at four widths, uploaded as a build artifact for a human
      # to glance at — never a reason to fail this job. See the long
      # comment at the top of scripts/capture-screenshots.mjs for why this
      # is deliberately artifacts-for-review rather than a pixel-diff gate:
      # short version, this project is still in active design iteration,
      # a strict visual assertion sitting in front of the only deploy path
      # would need re-approving after nearly every real change, and two of
      # the five pages need live Wix data or a signed-in session this job
      # doesn't have anyway.
      #
      # Runs against the actual Cloudflare Workers runtime (opennextjs
      # preview, i.e. workerd/Miniflare), not `next start` — deliberately.
      # A real bug shipped once that rendered correctly under `next start`
      # and was broken in production, because the two runtimes disagree
      # about what's available at request time (see lib/megadealAssets.ts).
      # A screenshot pass against `next start` would have shown the site
      # "working" the entire time that bug was live; this is the local
      # environment that actually would have caught it.
      #
      # Reuses the .open-next output the Build step above already
      # produced — calling the opennextjs CLI directly, not `npm run
      # cf:preview`, which would rebuild everything from scratch.
      - name: Capture screenshots (non-blocking)
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npx opennextjs-cloudflare preview > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:8787/coming-soon && break
            sleep 3
          done
          npm run screenshots
        env:
          NEXT_PUBLIC_SITE_URL: https://megadeal.co.nz

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshot-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://megadeal.co.nz
